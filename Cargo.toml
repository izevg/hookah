[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/izevg/hookah"
publish = false

[workspace.dependencies]
hookah-domain = { path = "crates/domain" }
hookah-application = { path = "crates/application" }
hookah-adapters = { path = "crates/adapters" }
hookah-harness = { path = "crates/harness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# killpg for timeouts; `unsafe` is forbidden, so no raw libc.
nix = { version = "0.30", default-features = false, features = ["signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Used by cargo-mutants (.cargo/mutants.toml): no debug info, faster builds of each mutant.
[profile.mutants]
inherits = "dev"
debug = 0
