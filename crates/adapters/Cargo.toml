[package]
name = "hookah-adapters"
description = "Driven adapters of hookah: filesystem, processes, storage, config, ecosystems."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hookah-domain.workspace = true
hookah-application.workspace = true
serde.workspace = true
serde_json.workspace = true
dunce = "1"
quick-xml = "0.38"
# Already in the tree through `setup`; its `serde` feature parses config files.
toml_edit = { version = "0.23", default-features = false, features = ["parse", "serde"] }

# Self-update (src/update). Each one is the smallest correct choice for its job:
# - ureq: a blocking HTTP client with no async runtime. Its proxy support reads HTTPS_PROXY,
#   HTTP_PROXY, and NO_PROXY; `platform-verifier` makes TLS trust the operating system's
#   certificate store, which is where a corporate TLS-inspecting proxy installs its root.
# - sha2: the SHA-256 that release archives are verified with, pure Rust.
# - flate2 + tar read the `.tar.gz` of Linux and macOS; zip reads the `.zip` of Windows, with
#   deflate only (no encryption, bzip2, zstd, or the zopfli compressor).
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
sha2 = "0.11"
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true

# Timeouts kill the whole process tree: a process group on Unix, a Job Object on Windows.
[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(windows)'.dependencies]
win32job = "2"
