[package]
name = "hookah-adapters"
description = "Driven adapters of hookah: filesystem, processes, storage, config, ecosystems."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hookah-domain.workspace = true
hookah-application.workspace = true
serde.workspace = true
serde_json.workspace = true
dunce = "1"

[lints]
workspace = true

# Timeouts kill the whole process tree: a process group on Unix, a Job Object on Windows.
[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(windows)'.dependencies]
win32job = "2"
