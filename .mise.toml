[tools]
rust = { version = "stable", components = "rustfmt,clippy", profile = "minimal" }
# No prebuilt arm64 macOS release exists, so this compiles once into ~/.local.
"cargo:cargo-mutants" = "27.1.0"
# Python samples: exact minor and uv for `samples/python`.
python = "3.13"
uv = "0.13.8"
# Node samples (samples/node/*); pnpm for the workspace sample.
node = "26"
pnpm = "12"
# Lints the GitHub Actions workflow: `mise exec -- actionlint`.
"aqua:rhysd/actionlint" = "1.7.12"
# Docs site (site/build.sh), installer checks, and the PowerShell installer test.
"aqua:rust-lang/mdBook" = "0.5.4"
"aqua:koalaman/shellcheck" = "0.11.0"
# Release versioning and notes from Conventional Commits (.github/cliff.toml).
"aqua:orhun/git-cliff" = "2.14.2"
"aqua:PowerShell/PowerShell" = "7.6.10"
# Java samples (samples/java/*): a JDK plus both build tools, all in ~/.local.
java = "temurin-21"
maven = "3.9.16"
gradle = "9.5.0"
