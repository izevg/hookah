name: release

# Cutting a release (one edit, then a tag):
#   1. Set `version` under `[workspace.package]` in Cargo.toml (every crate inherits it).
#   2. Run `cargo check --workspace` so Cargo.lock follows, and commit both files.
#   3. Tag the commit `vX.Y.Z` and push the tag. A tag with a `-` in it (`v1.0.0-rc.1`) publishes
#      a prerelease. The `preflight` job fails the run when the tag and Cargo.toml disagree.
#
# `workflow_dispatch` builds everything and uploads the archives as run artifacts, but publishes
# nothing: use it as a dry run.
#
# Targets are built natively where a runner exists. Exceptions, on purpose:
#   - x86_64-apple-darwin is cross-compiled on the Apple Silicon runner. Intel macOS runners are
#     being retired, and the Xcode SDK cross-compiles cleanly. Two plain archives (no `lipo`
#     universal2) keep the installer's OS/arch mapping trivial and the downloads small.
#   - aarch64-pc-windows-msvc is cross-compiled on the x64 Windows runner (not smoke-tested).
# Linux uses musl so the binary is fully static and runs on any distribution. The aarch64 build
# runs on GitHub's native ARM runner: no cross toolchain (zig, cross) to keep working.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check the tag against the Cargo version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo_version="$(awk -F'"' '/^\[workspace\.package\]/ {p=1; next} /^\[/ {p=0} p && /^version[[:space:]]*=/ {print $2; exit}' Cargo.toml)"
          if [ -z "$cargo_version" ]; then
            echo "::error::no version under [workspace.package] in Cargo.toml"
            exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$cargo_version" ]; then
              echo "::error::tag $REF_NAME does not match Cargo.toml version $cargo_version (expected v$cargo_version)"
              exit 1
            fi
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
      - name: Shellcheck the installer and scripts
        run: shellcheck site/install.sh .github/scripts/*.sh
      - name: Test the installers against a fake release
        run: .github/scripts/test-install.sh

  build:
    name: build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, ext: tar.gz, musl: true, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, ext: tar.gz, musl: true, smoke: true }
          - { target: x86_64-apple-darwin, os: macos-latest, ext: tar.gz, musl: false, smoke: false }
          - { target: aarch64-apple-darwin, os: macos-latest, ext: tar.gz, musl: false, smoke: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: zip, musl: false, smoke: true }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, ext: zip, musl: false, smoke: false }
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install the Rust target
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET" --no-self-update
          rustup default stable
      - name: Install musl-tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        run: cargo build --release --locked -p hookah --target "$TARGET"
      - name: Check the binary reports the release version
        if: matrix.smoke
        run: |
          bin="target/$TARGET/release/hookah"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          actual="$("$bin" --version)"
          if [ "$actual" != "hookah $VERSION" ]; then
            echo "::error::'hookah --version' printed '$actual', expected 'hookah $VERSION'"
            exit 1
          fi
      - name: Package
        run: |
          name="hookah-$VERSION-$TARGET"
          bin=hookah
          if [ "$EXT" = zip ]; then bin=hookah.exe; fi
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/$bin" LICENSE README.md "dist/$name/"
          cd dist
          if [ "$EXT" = zip ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hookah-${{ matrix.target }}
          path: dist/hookah-${{ needs.preflight.outputs.version }}-${{ matrix.target }}.${{ matrix.ext }}
          if-no-files-found: error

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: hookah-*
          merge-multiple: true
          path: dist
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum hookah-* > SHA256SUMS
          cat SHA256SUMS
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish
    # Dry runs (workflow_dispatch) stop at the checksums job.
    if: github.ref_type == 'tag'
    needs: [preflight, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          merge-multiple: true
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --generate-notes)
          case "$TAG" in
            *-*) args+=(--prerelease) ;;
          esac
          notes="Install: \`curl -fsSL https://izevg.github.io/hookah/install.sh | sh\` (Linux, macOS) or \`irm https://izevg.github.io/hookah/install.ps1 | iex\` (Windows). Verify downloads against \`SHA256SUMS\`."
          gh release create "$TAG" dist/* "${args[@]}" --notes "$notes"
