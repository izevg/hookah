name: release

# Builds every target and publishes the GitHub Release. Three ways in:
#   - `workflow_call` from auto-release.yml: the normal path, on every release-worthy squash merge
#     to main (version computed from Conventional Commits by git-cliff, see .github/cliff.toml).
#     Tags and releases made with GITHUB_TOKEN start no other workflow, so auto-release calls this
#     one directly. The release job creates the `vX.Y.Z` tag itself, after every build passed, so
#     a failed build never burns a version.
#   - a `v*` tag pushed by a human: the manual and emergency path. The build uses that tag's version.
#   - `workflow_dispatch`: a dry run. It builds everything and uploads the archives as run
#     artifacts, but publishes nothing. The `version` input is only a label for the archives.
#
# The version lives in the tag, never in Cargo.toml: the repository keeps `0.0.0` and local builds
# say so. Before building, .github/scripts/set-version.sh rewrites `version` under
# `[workspace.package]` (and Cargo.lock) in the CI checkout only, so `hookah --version` prints the
# release version. Nothing is committed back to main. A version with a `-` (`1.0.0-rc.1`) is a
# prerelease.
#
# Targets are built natively where a runner exists. Exceptions, on purpose:
#   - x86_64-apple-darwin is cross-compiled on the Apple Silicon runner. Intel macOS runners are
#     being retired, and the Xcode SDK cross-compiles cleanly. Two plain archives (no `lipo`
#     universal2) keep the installer's OS/arch mapping trivial and the downloads small.
#   - aarch64-pc-windows-msvc is cross-compiled on the x64 Windows runner (not smoke-tested).
# Linux uses musl so the binary is fully static and runs on any distribution. The aarch64 build
# runs on GitHub's native ARM runner: no cross toolchain (zig, cross) to keep working.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the dry-run archives (X.Y.Z)"
        type: string
        default: "0.0.0"
  workflow_call:
    inputs:
      version:
        description: "Version to release (X.Y.Z, no leading v)"
        type: string
        required: true
      ref:
        description: "Commit SHA to build and tag"
        type: string
        required: true

permissions:
  contents: read

# Not the caller's group: a called workflow sharing its caller's group would deadlock on it.
concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Resolve the version and the mode
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            # A human pushed the tag: it is the version.
            version="${REF_NAME#v}"
            sha="$GITHUB_SHA"
            publish=true
          elif [ -n "$INPUT_REF" ]; then
            # Called from auto-release: the publish job creates the tag.
            version="$INPUT_VERSION"
            sha="$INPUT_REF"
            publish=true
          else
            # Dry run.
            version="$INPUT_VERSION"
            sha="$GITHUB_SHA"
            publish=false
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a semantic version (X.Y.Z or X.Y.Z-pre)"
            exit 1
          fi
          {
            echo "version=$version"
            echo "sha=$sha"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
      - name: Shellcheck the installer and scripts
        run: shellcheck site/install.sh .github/scripts/*.sh
      - name: Test the installers against a fake release
        run: .github/scripts/test-install.sh

  build:
    name: build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, ext: tar.gz, musl: true, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, ext: tar.gz, musl: true, smoke: true }
          - { target: x86_64-apple-darwin, os: macos-latest, ext: tar.gz, musl: false, smoke: false }
          - { target: aarch64-apple-darwin, os: macos-latest, ext: tar.gz, musl: false, smoke: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: zip, musl: false, smoke: true }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, ext: zip, musl: false, smoke: false }
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - name: Set the release version (not committed)
        run: .github/scripts/set-version.sh "$VERSION"
      - name: Install the Rust target
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET" --no-self-update
          rustup default stable
      - name: Install musl-tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        run: cargo build --release --locked -p hookah --target "$TARGET"
      - name: Check the binary reports the release version
        if: matrix.smoke
        run: |
          bin="target/$TARGET/release/hookah"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          actual="$("$bin" --version)"
          if [ "$actual" != "hookah $VERSION" ]; then
            echo "::error::'hookah --version' printed '$actual', expected 'hookah $VERSION'"
            exit 1
          fi
      - name: Package
        run: |
          name="hookah-$VERSION-$TARGET"
          bin=hookah
          if [ "$EXT" = zip ]; then bin=hookah.exe; fi
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/$bin" LICENSE README.md "dist/$name/"
          cd dist
          if [ "$EXT" = zip ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hookah-${{ matrix.target }}
          path: dist/hookah-${{ needs.preflight.outputs.version }}-${{ matrix.target }}.${{ matrix.ext }}
          if-no-files-found: error

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: hookah-*
          merge-multiple: true
          path: dist
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum hookah-* > SHA256SUMS
          cat SHA256SUMS
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish
    # Dry runs (workflow_dispatch) stop at the checksums job.
    if: needs.preflight.outputs.publish == 'true'
    needs: [preflight, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      SHA: ${{ needs.preflight.outputs.sha }}
    steps:
      # The notes need the whole history and the tags.
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
      # jdx/mise-action v5.2.9
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          install_args: aqua:orhun/git-cliff
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          merge-multiple: true
          path: dist
      - name: Write the release notes
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            if [ "$GITHUB_REF_TYPE" != tag ]; then
              echo "::error::tag $tag already exists"
              exit 1
            fi
            # The pushed tag: the commits since the previous tag.
            git-cliff --config .github/cliff.toml --current --strip all > notes.md
          else
            git-cliff --config .github/cliff.toml --unreleased --tag "$tag" --strip all > notes.md
          fi
          {
            echo
            echo "---"
            echo "Install: \`curl -fsSL https://izevg.github.io/hookah/install.sh | sh\` (Linux, macOS) or \`irm https://izevg.github.io/hookah/install.ps1 | iex\` (Windows). Verify downloads against \`SHA256SUMS\`."
          } >> notes.md
          cat notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          args=(--repo "$GITHUB_REPOSITORY" --title "$tag" --notes-file notes.md)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            args+=(--verify-tag)
          else
            # No tag yet: the release creates it on the commit that was built.
            args+=(--target "$SHA")
          fi
          case "$VERSION" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "$tag" dist/* "${args[@]}"
